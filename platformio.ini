; PlatformIO Project Configuration File for AngRaksha (Team Astra)
; NIRMAAN 2026 - Smart Mobility & Aerospace

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = src

; Common configuration across environments
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Production Firmware Environment
[env:esp32dev]
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ANG_RAKSHA_FIRMWARE_VERSION=\"1.0.0\"
build_src_filter = 
    +<*>
    +<**/*>
    -<bringup_test.cpp>
lib_deps = 
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    Wire
    WiFi
    WebServer

; Standalone Hardware Bring-up + Telemetry Environment
[env:bringup]
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D BRINGUP_TEST
build_src_filter = 
    +<bringup_test.cpp>
lib_deps = 
    Wire
    WiFi
    HTTPClient
